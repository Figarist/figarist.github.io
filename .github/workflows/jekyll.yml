name: Deploy Jekyll with Polyglot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuild so future-dated posts publish themselves on their date.
  schedule:
    - cron: "15 8 * * *"

# Least privilege: only the deploy job gets pages/id-token write.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # jekyll-last-modified-at derives published timestamps from Git.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify build runtime
        run: |
          ruby --version
          bundle --version
          bundle exec jekyll --version

      - name: Cache Jekyll
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jekyll-cache
          key: ${{ runner.os }}-jekyll-${{ hashFiles('Gemfile.lock') }}-${{ hashFiles('_config.yml') }}
          restore-keys: |
            ${{ runner.os }}-jekyll-

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Validate tutoring content rules
        run: bundle exec ruby scripts/test_tutoring_content.rb

      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update

      - name: Validate vendored browser libraries
        run: bundle exec ruby scripts/test_vendor_assets.rb

      - name: Check Jekyll diagnostics
        run: bundle exec jekyll doctor

      - name: Validate multilingual pagination
        run: bundle exec ruby scripts/test_polyglot_pagination.rb

      - name: Validate tutoring build guards
        run: bundle exec ruby scripts/test_tutoring_build.rb

      - name: Validate service worker routing
        run: node scripts/test_service_worker.cjs

      - name: Audit author readiness status
        run: bundle exec ruby scripts/verify_author_ready.rb

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Verify content timestamps (Git for pages, explicit dates for posts)
        run: bundle exec ruby scripts/test_last_modified_history.rb

      - name: Validate production metadata and budgets
        run: bundle exec ruby scripts/test_site.rb

      - name: Validate all local links and preserve published routes
        run: bundle exec ruby scripts/audit_links.rb

      - name: Test generated site with HTML Proofer
        run: |
          bundle exec htmlproofer ./_site \
            --allow-hash-href \
            --ignore-empty-alt \
            --disable-external \
            --ignore-urls "/^\/m\//"

      # Third-party availability and bot policies are outside the deploy
      # contract. Report regressions here without blocking a valid site build.
      - name: Probe external links (advisory)
        continue-on-error: true
        run: |
          bundle exec htmlproofer ./_site \
            --allow-hash-href \
            --ignore-empty-alt \
            --ignore-urls "/^\/m\//,/^https:\/\/(sivochka\.com|figarist\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|mermaid\.ink|polyfill\.io)/,/^https:\/\/buki\.com\.ua\/user-82505\/$/"

      - name: Check JS bundle size
        run: |
          JS_SIZE=$(wc -c < _site/script.js)
          echo "JS size: $JS_SIZE bytes"
          if [ $JS_SIZE -gt 20480 ]; then
            echo "::error::JS exceeds 20KB budget ($JS_SIZE bytes)"
            exit 1
          fi

      - name: Check gzipped CSS bundle size
        run: |
          CSS_SIZE=$(gzip -c _site/assets/css/styles.css | wc -c)
          echo "Gzipped CSS size: $CSS_SIZE bytes"
          if [ $CSS_SIZE -gt 30720 ]; then
            echo "::error::Gzipped CSS exceeds 30KB budget ($CSS_SIZE bytes)"
            exit 1
          fi

      - name: Check tutoring drafts stay out of public output
        run: |
          test ! -e _site/docs/tutoring-content-guide.md
          if rg -n "case-template|synthetic-build-bad|student_cases" _site; then
            echo "::error::Draft or synthetic tutoring content leaked into _site"
            exit 1
          fi

      # IndexNow: list pages whose HTML changed since the last successful submission.
      - name: Restore IndexNow manifest
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-prev
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Plan IndexNow submission
        run: node scripts/indexnow.mjs plan --site _site --origin https://sivochka.com --prev .indexnow-prev/manifest.json --out indexnow-plan

      - name: Upload IndexNow plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexnow-plan
          path: indexnow-plan/
          retention-days: 3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify live domain
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify sitemap URLs and domain redirects
        run: ruby scripts/verify_live_site.rb

  indexnow:
    name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download IndexNow plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-plan
          path: .indexnow

      - name: Submit changed URLs
        run: node scripts/indexnow.mjs submit --dir .indexnow --origin https://sivochka.com

      - name: Remember submitted state
        run: mkdir -p .indexnow-prev && cp .indexnow/manifest.json .indexnow-prev/manifest.json

      - name: Save IndexNow manifest
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-prev
          key: indexnow-${{ github.run_id }}

  notify_failure:
    name: Notify Telegram on failure
    if: failure()
    needs: [build, deploy, verify, indexnow]
    permissions:
      contents: read
    uses: ./.github/workflows/notify-telegram.yml
    with:
      title: "Deploy failed on ${{ github.ref_name }}"
      status: "error"
      details: "Commit ${{ github.sha }}"
    secrets: inherit
