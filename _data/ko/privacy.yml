# %EMAIL% and %TELEGRAM% are replaced in privacy/index.html with site.email and the tutoring Telegram URL.
nav: "개인정보 처리방침"
title: "개인정보 처리방침"
updated: "최종 업데이트: 2026년 11월 27일"
intro: >-
  이 페이지는 sivochka.com을 방문하거나, 무료 도구와 게임을 사용하거나, 수업에 대해 문의할 때 데이터가 어떻게 처리되는지
  설명합니다. 요약: 쿠키 없음, 광고 없음, 마케팅을 위한 데이터 판매나 공유 없음, 다른 웹사이트에 걸친 추적 없음.
sections:
  - h: "책임자"
    body:
      - >-
        개인정보 처리 책임자는 우크라이나에 등록된 개인사업자(FOP) 이호르 시보치카(Ihor Sivochka)입니다. 개인정보 관련 문의는
        <a href="mailto:%EMAIL%">%EMAIL%</a> 또는 <a href="%TELEGRAM%">Telegram</a>으로 보내 주세요.
  - h: "호스팅과 보안"
    body:
      - >-
        이 사이트는 GitHub Pages(GitHub, Inc., 미국)에서 호스팅되며 Cloudflare(Cloudflare, Inc., 미국)를 통해 제공됩니다.
        Cloudflare는 사이트 속도를 높이고 공격과 악성 봇으로부터 보호합니다. 페이지를 보여 주기 위해 이 제공업체들은 IP 주소,
        브라우저 유형(User-Agent), 요청한 주소, 이전 페이지, 시간 등 기술적 요청 데이터를 처리합니다. 이는 사이트를 표시하고
        안전하게 유지하는 데 필요합니다(정당한 이익, GDPR 제6조 제1항 f호). 제공업체는 이러한 로그를 자체 정책에 따라 짧은 기간
        보관하며, 저는 그들로부터 IP 주소를 받지 않습니다.
  - h: "방문 통계"
    body:
      - >-
        어떤 페이지와 도구가 유용한지 파악하기 위해 쿠키를 사용하지 않는 두 가지 서비스로 방문을 집계합니다.
      - list:
          - >-
            <b>GoatCounter</b>(오픈 소스, EU 서버)는 Cloudflare의 자체 프록시를 통해 작동합니다. 페이지뷰마다 순 방문자 집계를
            위해 IP 주소, User-Agent, 이전 페이지를 받으며 IP는 저장하지 않습니다. 또한 일부 버튼 클릭(예: "Telegram으로
            문의" 또는 게임 시작)을 누가 클릭했는지 알지 못한 채 집계합니다.
          - >-
            <b>Cloudflare Web Analytics</b>는 호스팅 제공업체의 스크립트로, 방문 수와 페이지 로드 속도를 집계합니다. 쿠키나
            브라우저 핑거프린팅을 사용하지 않으며 방문자 프로필을 만들지 않습니다.
      - >-
        저는 방문 수, 유입 사이트, 방문 페이지, 국가 등 합계만 봅니다. 어느 서비스도 사용자를 식별하지 않으며, 이 데이터를 다른
        데이터와 결합하지 않습니다. 법적 근거는 사이트를 유용하게 유지하려는 정당한 이익입니다(GDPR 제6조 제1항 f호). 두 서비스
        모두 콘텐츠 차단기로 차단할 수 있으며, 사이트는 계속 작동합니다.
  - h: "브라우저에 저장되는 것"
    body:
      - >-
        이 사이트는 쿠키를 설정하지 않습니다. 다음 항목은 사용자의 브라우저에만 저장되며 저에게 전송되지 않습니다.
      - list:
          - "선택한 언어(다음 방문 시 해당 언어로 열리도록);"
          - "사이트 파일 캐시(service worker)(페이지를 더 빠르게 열고 오프라인에서도 작동하도록);"
          - "무료 도구 안의 설정과 진행 상황(예: LEGO 카탈로그의 즐겨찾기);"
          - "play.sivochka.com에서 게임을 시작할 때의 게임 저장 데이터와 게임 파일 캐시."
      - >-
        브라우저 설정(sivochka.com 사이트 데이터)에서 언제든지 모두 삭제할 수 있습니다.
  - h: "도구는 사용자 기기에서 작동합니다"
    body:
      - >-
        무료 도구(OGCruncher, pyScratch, Can I Run Unity, Bouncy, LEGO 설명서 카탈로그 등)는 파일과 설정을 브라우저에서 직접
        처리합니다. 사용자가 여는 오디오 파일, Scratch 프로젝트 및 기타 파일은 어디에도 업로드되지 않습니다. Bouncy는 사용자가
        허용한 후에만 마이크를 사용하고, 기기에서 소리 크기만 측정하며 소리를 녹음하거나 전송하지 않습니다.
  - h: "동영상과 외부 링크"
    body:
      - >-
        과외 페이지의 소개 동영상은 재생 버튼을 누른 후에만 YouTube(Google)에서 불러옵니다. 그 전에는 YouTube로 어떤 요청도
        보내지 않습니다. 재생 후에는 Google의
        <a href="https://policies.google.com/privacy?hl=ko" rel="noopener">개인정보처리방침</a>이 적용됩니다. Telegram,
        GitHub, Google Drive(LEGO 설명서), Wrist &amp; Pocket Studio 및 기타 사이트로 가는 링크는 해당 서비스를 열며, 그곳에서는
        각 서비스의 정책이 적용됩니다.
  - h: "수업 문의"
    body:
      - >-
        이 사이트에는 입력 양식이 없습니다. Telegram이나 이메일로 연락하시면 보내 주신 내용(이름, 연락처, 학생의 나이, 수준,
        목표)을 받게 되며, 이는 답변과 수업 일정 조율 및 진행에만 사용합니다(계약 체결 전 단계 및 계약 이행, GDPR 제6조 제1항
        b호). 대화 내용은 함께 수업하는 동안, 그리고 우크라이나의 결제 회계 규정이 요구하는 기간 동안 보관하며, 법적으로 보관할
        의무가 없으면 요청 시 삭제합니다. 결제는 우크라이나 개인사업자 계좌로 이루어지며, 사이트 자체는 결제를 처리하지 않습니다.
      - >-
        자체 통계를 위해 날짜, 문의 경로(예: Google 또는 Telegram), 단계(문의, 체험 수업, 학생)만 기록합니다. 이름이나 연락처는
        저장하지 않습니다.
  - h: "아동"
    body:
      - >-
        미성년자의 수업은 부모 또는 보호자와 함께 정합니다. 사이트는 아동에게 개인정보를 요청하지 않습니다. 학생 프로젝트는 부모의
        서면 동의가 있을 때만 게시되며, 이름, 성의 첫 글자, 나이만 표시하고 사진이나 도시는 표시하지 않습니다.
  - h: "국외 이전"
    body:
      - >-
        Cloudflare, GitHub, Google은 미국에 있습니다. 이들에 대한 데이터 이전은 EU–US Data Privacy Framework와 이 회사들이
        사용하는 유럽연합 집행위원회의 표준계약조항에 근거합니다.
  - h: "사용자의 권리"
    body:
      - >-
        GDPR(EU/EEA), UK GDPR, 우크라이나 「개인정보 보호법」에 따라 제가 보유한 본인 데이터를 확인하고, 정정 또는 삭제를 요청하고,
        처리 제한이나 이의를 제기하고, 이동 가능한 형식으로 받을 수 있습니다. <a href="mailto:%EMAIL%">%EMAIL%</a>로 연락해 주시면
        30일 이내에 답변드립니다. 또한 거주 국가의 개인정보 보호 기관에 민원을 제기할 수 있습니다(우크라이나의 경우 우크라이나 의회
        인권 옴부즈만).
  - h: "변경"
    body:
      - >-
        새로운 서비스를 추가하거나 데이터 사용 방식을 변경하는 경우, 변경이 적용되기 전에 이 페이지를 업데이트하고 상단의 날짜를
        변경합니다.
