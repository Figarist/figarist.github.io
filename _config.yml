# ============================================================
#  Ihor Sivochka — Jekyll Configuration
# ============================================================

title: "Ihor Sivochka — Indie Game Dev, Wear OS & Tech Educator"
description: "Personal hub of Ihor Sivochka. Indie game developer specializing in Wear OS, computer science teacher, and retro tech enthusiast. Building tiny worlds for tiny screens."
url: "https://sivochka.com"
baseurl: ""

lang: "en"
email: "igorsivoch@gmail.com"
author:
  name: "Sivochka Ihor"
  twitter: "figarist"
  url: "https://sivochka.com"

twitter:
  username: "figarist"
  card: "summary_large_image"

social:
  name: "Sivochka Ihor"
  links:
    - "https://www.linkedin.com/in/ihor-sivochka/"
    - "https://github.com/Figarist"
    - "https://t.me/sivochka_ua"

# ── Build ────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
sass:
  style: compressed
  sourcemap: never

# ── Collections ──────────────────────────────────────────────
# Exclude dev artefacts from the build
exclude:
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - AI_CONTEXT.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .agent/
  - .agents/
  - .git/
  - build.log
  - build_prod.log
  - build_error.txt
  - build_out.txt
  - build_trace.txt
  - build_verbose.txt
  - docs/
  - project_context.md
  - .frontmatter/
  - scripts/
  - test/
  - frontmatter.json
  - qa-screenshots
  - qa-screenshots/**
  - _drafts/
  - mise.toml
  - renovate.json

# ── Plugins ──────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-polyglot
  - jekyll-paginate-v2
  - jekyll-spaceship
  - jekyll-minifier
  - jekyll-redirect-from
  - jekyll-pwa-workbox
  - jekyll-toc
  - jekyll-last-modified-at
  - jekyll-archives

redirect_from:
  json: false

# ── Pagination Settings ──────────────────────────────────────
pagination:
  enabled: true
  per_page: 6
  permalink: "/page/:num/"
  limit: 0
  sort_field: "date"
  sort_reverse: true

# ── Polyglot Settings ────────────────────────────────────────
languages: ["en", "uk", "ru", "ko", "pl"]
default_lang: "en"
exclude_from_localization:
  - security.txt
  - favicon.ico
  - assets
  - css
  - javascript
  - images
  - js
  - sitemap.xml
  - robots.txt
  - styles.scss
  - styles.css
  - manifest.json
  - service-worker.js
  - sw.js
  - sw-register.js
  - redirects.json
  - qa-screenshots
  - lego-catalog
  - OGCruncher
  - 3d-club-studio
  - bouncy
  - canirunUnity
  - pyScratch
  - feed.xml
parallel_localization: false

# ── Defaults ─────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/default-social-card.webp"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
# ── Permalink ─────────────────────────────────────────────────
permalink: /blog/:year/:month/:day/:title/

# ── Feed ──────────────────────────────────────────────────────
feed:
  path: feed.xml

# ── Spaceship Settings ──────────────────────────────────────
jekyll-spaceship:
  mathjax-processor:
    src: "/assets/vendor/mathjax/tex-mml-chtml.js"
    config:
      tex2jax:
        inlineMath: [["$", "$"], ['\\(', '\\)']]
        displayMath: [["$$", "$$"], ['\\[', '\\]']]
        processEscapes: true
  video:
    youtube:
      width: 100%
      height: auto
  audio:
  table:

# ── Minifier Settings ────────────────────────────────────────
jekyll-minifier:
  # Sass already emits compressed CSS; cssminify2 breaks var() inside calc()
  # (it rewrote calc(var(--nav-floating-top) + 96px) into invalid CSS).
  compress_css: false
  exclude:
    - "node_modules/**/*"
    - "vendor/**/*"
    - "assets/vendor/**/*"
    - "assets/**/*.json"
    - "bouncy/**/*"
    - "sitemap.xml"
    - "feed.xml"
# ── PWA Settings ──────────────────────────────────────────────
pwa:
  sw_src_filepath: "service-worker.js"
  sw_dest_filename: "sw.js"
  precache_glob_directory: "/"
  precache_glob_patterns:
    - "assets/css/*.css"
    - "assets/fonts/*.woff2"
    - "assets/images/**/*.{webp,png,svg}"
    - "script.js"
    - "**/search.json"
    - "manifest.json"
    - "**/index.html"
    - "404.html"
    - "tutoring/**/*.html"
    - "uk/tutoring/**/*.html"
    - "ru/tutoring/**/*.html"
    - "ko/tutoring/**/*.html"
    - "pl/tutoring/**/*.html"

# ── TOC Settings ──────────────────────────────────────────────
toc:
  min_level: 2
  max_level: 4
  list_class: "toc__list"
  item_class: "toc__item"
  sublist_class: "toc__sublist"

# ── Archives Settings ────────────────────────────────────────
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive
    tag: archive
  permalinks:
    category: /blog/category/:name/
    tag: /blog/tag/:name/
