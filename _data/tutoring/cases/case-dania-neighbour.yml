    title: "Hello Neighbour — 3D Mystery Adventure with Smart AI"
    card_description: "One-year achievement: a full two-story house, item inventory, key puzzles, and a clever Neighbour who reacts to sounds and tracks the player."
    full_description: "Dania is a huge fan of Hello Neighbor and dreamed of making his own version of the game. Over a year of weekly lessons, he advanced from simple basics to an impressive 3D experience featuring an explorable house, cinematic intro cutscene, interactive doors, ladders, and a reactive neighbour searching the rooms."
    starting_level: "Complete beginner with zero coding background, fueled by huge enthusiasm for his favorite game."
    goal: "Understand how real 3D games are built and create an atmospheric mystery game with house exploration."
    created: "First-person 3D game: fully authored house, smart AI opponent, 5-item inventory, key-hunting quest, and cinematic intro cutscene."
    student_work: "Designed the house architecture and interior, coded the item inventory, object pickup & throw mechanics, character animations, and directed the cinematic intro scene."
    tutor_help: "Guided the AI logic so the Neighbour can explore rooms, open doors naturally, and react to player footsteps, while implementing a reliable lock-and-key quest system."
    skills:
      - "Core C# programming fundamentals in Unity"
      - "Designing AI behavior for game opponents"
      - "Item inventory and physical object interactions"
      - "3D spatial design, lighting, and camera control"
      - "Directing cinematic cutscenes and storytelling"
      - "Long-term project discipline (over a year of development)"
