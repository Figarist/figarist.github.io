    full_description: "Максим хотел создать не просто учебный проект, а динамичную экшен-игру, в которую можно играть с друзьями через интернет. Вместе мы реализовали полноценный хоккейный бой: игрок управляет хоккеистом, чувствует скольжение по льду, отбивает волны зомби и забивает их клюшкой в ворота соперника."
    starting_level: "Ученик уже знал основы компьютера и немного программировал, но хотел создать сложную 3D-игру с мультиплеером."
    goal: "Создать авторскую игру с нуля и сыграть в неё по сети с друзьями."
