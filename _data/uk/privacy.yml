# %EMAIL% and %TELEGRAM% are replaced in privacy/index.html with site.email and the tutoring Telegram URL.
nav: "Політика конфіденційності"
title: "Політика конфіденційності"
updated: "Останнє оновлення: 27 листопада 2026"
intro: >-
  Тут пояснено, що відбувається з вашими даними, коли ви відкриваєте sivochka.com, користуєтеся безкоштовними
  інструментами та іграми або пишете мені щодо занять. Коротко: без cookies, без реклами, без продажу чи передачі
  даних для маркетингу і без стеження на інших сайтах.
sections:
  - h: "Хто відповідає за дані"
    body:
      - >-
        Володілець персональних даних — Ігор Сівочка, фізична особа-підприємець (ФОП), зареєстрований в Україні. З
        будь-якого питання про приватність пишіть на <a href="mailto:%EMAIL%">%EMAIL%</a> або в
        <a href="%TELEGRAM%">Telegram</a>.
  - h: "Хостинг і безпека"
    body:
      - >-
        Сайт розміщено на GitHub Pages (GitHub, Inc., США) і доставляється через Cloudflare (Cloudflare, Inc., США), який
        пришвидшує його та захищає від атак і шкідливих ботів. Щоб показати сторінку, ці провайдери обробляють технічні
        дані запиту: IP-адресу, тип браузера (User-Agent), адресу сторінки, сторінку, з якої ви прийшли, і час. Це
        потрібно, щоб сайт працював і був у безпеці (законний інтерес, ст. 6(1)(f) GDPR). Провайдери зберігають такі
        журнали недовго за власними правилами; я вашої IP-адреси від них не отримую.
  - h: "Статистика відвідувань"
    body:
      - >-
        Щоб розуміти, які сторінки й інструменти корисні, я рахую відвідування двома сервісами без cookies:
      - list:
          - >-
            <b>GoatCounter</b> (відкритий код, сервери в ЄС), який працює через мій власний проксі на Cloudflare. Під час
            кожного перегляду він отримує IP-адресу, User-Agent і сторінку, з якої ви прийшли, щоб рахувати унікальні
            візити, і не зберігає IP. Також він рахує натискання деяких кнопок (наприклад «Написати в Telegram» чи
            запуск гри), не знаючи, хто саме натиснув.
          - >-
            <b>Cloudflare Web Analytics</b> — скрипт хостинг-провайдера, який рахує візити та швидкість завантаження
            сторінок. Він не використовує cookies і відбитки браузера та не створює профілів відвідувачів.
      - >-
        Я бачу лише загальні цифри: скільки візитів, з яких сайтів, на які сторінки, з якої країни. Жоден сервіс не
        ідентифікує вас, і я не поєдную ці дані з будь-якими іншими. Правова підстава — законний інтерес робити сайт
        корисним (ст. 6(1)(f) GDPR). Обидва можна заблокувати будь-яким блокувальником, сайт працюватиме далі.
  - h: "Що зберігається у вашому браузері"
    body:
      - >-
        Сайт не встановлює cookies. Кілька речей зберігаються лише у вашому браузері й ніколи не надсилаються мені:
      - list:
          - "вибрана мова, щоб наступного разу сайт відкрився нею;"
          - "кеш файлів сайту (service worker), щоб сторінки відкривалися швидше й працювали офлайн;"
          - "налаштування та прогрес у безкоштовних інструментах, наприклад обране в каталозі LEGO;"
          - "збереження ігор і кеш ігрових файлів, коли ви запускаєте гру з play.sivochka.com."
      - >-
        Усе це можна будь-коли видалити в налаштуваннях браузера (дані сайту sivochka.com).
  - h: "Інструменти працюють на вашому пристрої"
    body:
      - >-
        Безкоштовні інструменти (OGCruncher, pyScratch, Can I Run Unity, Bouncy, каталог інструкцій LEGO та інші)
        обробляють ваші файли й налаштування прямо в браузері. Аудіофайли, проєкти Scratch та інші файли, які ви
        відкриваєте, нікуди не завантажуються. Bouncy вмикає мікрофон лише після вашого дозволу, вимірює гучність на
        пристрої та не записує й не надсилає звук.
  - h: "Відео та зовнішні посилання"
    body:
      - >-
        Вступне відео на сторінках репетиторства завантажується з YouTube (Google) лише після натискання «Відтворити»; до
        цього жодного запиту до YouTube немає. Після запуску діє
        <a href="https://policies.google.com/privacy?hl=uk" rel="noopener">політика конфіденційності Google</a>.
        Посилання на Telegram, GitHub, Google Drive (інструкції LEGO), Wrist &amp; Pocket Studio та інші сайти відкривають
        ці сервіси, і там діють їхні власні правила.
  - h: "Коли ви пишете мені щодо занять"
    body:
      - >-
        На сайті немає форм. Якщо ви пишете мені в Telegram або на пошту, я отримую те, що ви надсилаєте (ім'я, контакт,
        вік учня, рівень і цілі), і використовую це лише для відповіді, домовленості та проведення занять (дії до
        укладення й виконання договору, ст. 6(1)(b) GDPR). Листування зберігаю, поки ми працюємо разом, і стільки, скільки
        вимагають українські правила обліку платежів, а на ваш запит видаляю, якщо закон не вимагає його зберігати.
        Оплата надходить на рахунок українського ФОП; сам сайт платежів не обробляє.
      - >-
        Для власної статистики я записую лише дату, канал, звідки прийшов запит (наприклад Google чи Telegram), і етап
        (написав, пробне заняття, учень). Імен і контактів там немає.
  - h: "Діти"
    body:
      - >-
        Заняття для неповнолітніх домовляються з батьками або опікунами. Сайт не запитує в дітей персональних даних.
        Проєкти учнів публікуються лише з письмової згоди батьків і показують тільки ім'я, першу літеру прізвища та
        вік, без фото й міста.
  - h: "Передача даних за кордон"
    body:
      - >-
        Cloudflare, GitHub і Google розташовані в США. Передача даних їм ґрунтується на рамковій угоді EU–US Data Privacy
        Framework і стандартних договірних положеннях Європейської комісії, які використовують ці компанії.
  - h: "Ваші права"
    body:
      - >-
        Згідно з GDPR (ЄС/ЄЕЗ), UK GDPR і Законом України «Про захист персональних даних» ви можете дізнатися, які дані
        про вас у мене є, виправити чи видалити їх, обмежити обробку або заперечити проти неї та отримати дані у
        зручному форматі. Пишіть на <a href="mailto:%EMAIL%">%EMAIL%</a>; відповідаю протягом 30 днів. Також ви можете
        подати скаргу до органу захисту даних своєї країни (в Україні — до Уповноваженого Верховної Ради України з прав
        людини).
  - h: "Зміни"
    body:
      - >-
        Якщо я додам нові сервіси чи зміню спосіб використання даних, то оновлю цю сторінку до того, як зміна почне діяти,
        і зміню дату вгорі.
