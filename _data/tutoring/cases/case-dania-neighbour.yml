  uk:
    ready: true
    title: "Hello Neighbour — 3D-пригода з таємницями та розумним ворогом"
    card_description: "Результат року занять: великий двоповерховий будинок, інвентар предметів, головоломки з ключами та сусід, який чує шум і шукає гравця."
    full_description: "Даня дуже любить гру Hello Neighbor і мріяв зробити власний схожий світ. За рік регулярних щотижневих занять він пройшов шлях від перших кроків у програмуванні до повноцінного 3D-проєкту. У грі є великий будинок, кінематографічна заставка як у кіно, інтерактивні двері, драбини та сусід, який патрулює кімнати."
    starting_level: "Початківець без попереднього досвіду коду, але з величезним натхненням створити гру своєї мрії."
    goal: "Зрозуміти, як влаштовані справжні 3D-ігри, і побудувати свій атмосферний будинок із загадками та небезпечним сусідом."
    created: "3D-гра від першої особи: продуманий будинок, розумний ворог, інвентар на 5 речей, квест пошуку ключів і вступний відеоролик."
    student_work: "Спроєктував планування та інтер'єр будинку, запрограмував інвентар предметів, механіку підбору й кидання речей, налаштував анімації персонажа та створив кінематографічну заставку."
    tutor_help: "Допоміг створити логіку штучного інтелекту сусіда (щоб він умів самостійно оглядати кімнати, відчиняти двері та бігти на шум кроків), а також налаштував квестову систему перевірки замків."
    skills:
      - "Основи програмування на мові C# у Unity"
      - "Створення штучного інтелекту для ігрових ворогів"
      - "Система інвентаря та взаємодії з предметами"
      - "Робота з 3D-простором, камерою та освітленням"
      - "Режисура та створення катсцен (анімаційних заставок)"
      - "Уміння доводити великий проєкт до кінця (понад рік роботи)"
    evidence: "Жива 3D-гра з понад сотнею збережених етапів роботи, у яку можна грати та досліджувати будинок."
