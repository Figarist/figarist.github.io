{% assign t = site.data[site.active_lang].tutoring %}
{% assign tutoring_settings = site.data.tutoring.settings %}
<section class="tutoring-promo" aria-labelledby="tutoring-promo-title">
  <div>
    <p class="tutoring-eyebrow">{{ site.data[site.active_lang].strings.price_display_main }}</p>
    <h2 id="tutoring-promo-title">{{ t.courses[0].title }}</h2>
    <p>{{ t.language }}</p>
  </div>
  <a class="tutoring-button" href="{{ '/tutoring/' | relative_url }}">{{ t.all }} →</a>
</section>
