    title: "Hello Neighbour — 인공지능 이웃이 등장하는 3D 미스터리 어드벤처"
    card_description: "1년 수업의 결실: 2층 주택 탐색, 소지품 인벤토리, 열쇠 퍼즐, 발소리를 듣고 쫓아오는 인공지능 이웃."
    full_description: "다냐 학생은 Hello Neighbor 게임을 매우 좋아하여 자신만의 게임을 만들고 싶어 했습니다. 1년 동안 매주 꾸준히 수업을 들으며 기초 코드부터 시작해 탐험 가능한 2층 집, 영화 같은 오프닝 컷씬, 상호작용 가능한 문과 사да리, 방을 순찰하는 이웃 AI가 있는 멋진 3D 게임을 완성했습니다."
    starting_level: "프로그래밍 경험이 전혀 없었으나, 좋아하는 게임을 직접 만들고 싶다는 강한 열정으로 시작함."
    goal: "실제 3D 게임의 원리를 배우고, 퍼즐과 인공지능 이웃이 있는 나만의 게임 공간 완성하기."
    created: "1인칭 3D 게임: 디테일한 2층 주택, 지능형 적 AI, 5칸 인벤토리, 열쇠 찾기 퀘스트, 시네마틱 오프닝 영상."
    student_work: "집의 구조와 방 인테리어 설계, 인벤토리 시스템 구현, 물건 줍기/던지기 물리 조작, 캐릭터 애니메이션 세팅, 오프닝 컷씬 연출."
    tutor_help: "이웃 AI가 스스로 방을 돌아다니고 문을 열며 발소리에 반응해 달려오도록 인공지능 로직 설계 지원 및 퀘스트 잠금 시스템 지도."
    skills:
      - "Unity C# 프로그래밍 기본기 및 논리력"
      - "게임 적 캐릭터를 위한 인공지능(AI) 설계"
      - "소지품 인벤토리 및 물리 상호작용 시스템"
      - "3D 공간 디자인, 조명 및 카메라 연출"
      - "시네마틱 컷씬 연출 및 스토리텔링"
      - "1년 이상 꾸준히 프로젝트를 완성해내는 끈기와 성취감"
    evidence: "100개 이상의 개발 기록이 누적된, 실제로 탐험하고 플레이할 수 있는 완성형 3D 게임."
