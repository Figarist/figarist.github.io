    ready: true
    title: "Hello Neighbour — 3D-приключение с тайнами и умным врагом"
    card_description: "Результат года занятий: большой двухэтажный дом, инвентарь предметов, головоломки с ключами и сосед, который слышит шум и ищет игрока."
    full_description: "Даня очень любит игру Hello Neighbor и мечтал сделать собственный похожий мир. За год регулярных занятий он прошёл путь от первых строк кода до полноценного 3D-проекта. В игре есть большой дом, кинематографичная заставка, интерактивные двери, лестницы и сосед, который патрулирует комнаты."
    starting_level: "Начинающий без опыта программирования, но с огромным желанием создать любимую игру."
    goal: "Понять, как устроены настоящие 3D-игры, и построить свой атмосферный дом с загадками и соседом."
    created: "3D-игра от первого лица: продуманный дом, умный враг, инвентарь на 5 вещей, квест поиска ключей и вступительный видеоролик."
    student_work: "Спроектировал планировку и интерьер дома, запрограммировал инвентарь предметов, механику подбора и бросания вещей, настроил анимации персонажа и создал кинематографичную заставку."
    tutor_help: "Помог создать логику искусственного интеллекта соседа (чтобы он умел самостоятельно осматривать комнаты, открывать двери и бежать на шум шагов), а также настроил квестовую систему проверки замков."
    skills:
      - "Основы программирования на языке C# в Unity"
      - "Создание искусственного интеллекта для игровых врагов"
      - "Система инвентаря и взаимодействия с предметами"
      - "Работа с 3D-пространством, камерой и освещением"
      - "Режиссура и создание катсцен (анимационных заставок)"
      - "Умение доводить большой проект до конца (более года работы)"
    evidence: "Живая 3D-игра с более чем сотней сохранённых этапов работы, в которую можно играть и исследовать дом."
