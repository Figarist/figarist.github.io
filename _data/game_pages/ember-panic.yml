en:
  title: "Ember Panic"
  tagline: "Put out the fire. Drag the neighbours out. Close the doors behind you."
  kicker: "Unity 6 WebGL Contest Prototype"
  badge: "Flame and Blame Dev Contest"
  cover_alt: "Ember Panic — fiery title over a burning apartment hallway, a panicked resident, and a red fire extinguisher"
  screenshot_alts:
    "01-extinguisher-hallway": "First-person view in a burning apartment hallway with a red fire extinguisher and a resident in the flames"
    "02-burning-doorway-duo": "Two wide-eyed residents standing in front of a burning doorway inside the apartment block"
    "03-night-street-rescue": "Night street outside the burning 4-storey apartment building with the rescue van and fleeing residents"
    "04-resident-panic": "Mustachioed resident in overalls and paper hat staring in panic in front of a doorway on fire"
  event_label: "Contest"
  event_value: "Flame and Blame Dev Contest (RetroStyle Games), 2026"
  build_time: "9 days"
  desktop_hint: "Desktop only: you need a keyboard and a mouse. The first load is about 19 MB."
  about: "A first-person firefighting and rescue game inside a burning 4-storey apartment block. Fire, smoke, doors and ten panicking residents share one live simulation: an open door lets the fire run into the next room, a closed one holds it back. You have three minutes, an extinguisher, an axe and a defibrillator to get at least six of them into the rescue van before the building comes down."
  controls: "WASD — move, mouse — look, Space / Shift / Ctrl (or C) — jump / sprint / crouch. E — open or close doors, grab or drop a resident or item. Left click — spray, swing the axe, use the defibrillator, hold to charge a throw. 1 / 2 / 3 — switch tools, mouse wheel — grab distance. F — flashlight, M — mute voices, R — restart, Esc — pause."
  story_title: "Why this prototype exists"
  story: "Ember Panic is my entry for the Flame and Blame Dev Contest by RetroStyle Games. The brief was to take one mechanic and make it work as a system, not a single effect, in Unity and with AI-assisted development. I picked fire spread through doors: residents, smoke, the extinguisher and the collapse timer all read and change the same fire grid. AI helped with 3D models, procedural audio, code and editor checks; the design, tuning, lighting and playtesting are mine."
  faq:
    - q: "Can I play Ember Panic on a phone?"
      a: "No. It is a first-person game that needs a keyboard and a mouse, so play it in a desktop browser (Chrome, Edge or Firefox)."
    - q: "How do I win?"
      a: "Get the residents out of the building and into the rescue van before the 3-minute timer runs out or the building collapses. Putting the fire out completely switches the goal to saving everyone who is left."
    - q: "Why do doors matter so much?"
      a: "Fire spreads from room to room through open doors many times faster than through walls. Closing a door behind you buys time; smashing one open with the axe lets the fire through."
    - q: "Can students build a game like this in your Unity lessons?"
      a: "Yes. In 1-on-1 Unity & C# lessons we build playable 2D/3D prototypes, including simple simulations like this fire grid, and publish them to WebGL so students can share a live link."

uk:
  title: "Ember Panic"
  tagline: "Гаси вогонь. Витягай сусідів. Зачиняй двері за собою."
  kicker: "Конкурсний прототип на Unity 6 WebGL"
  badge: "Flame and Blame Dev Contest"
  cover_alt: "Ember Panic — вогняний логотип поверх палаючого коридору квартири, переляканого мешканця й червоного вогнегасника"
  screenshot_alts:
    "01-extinguisher-hallway": "Вигляд від першої особи у палаючому коридорі: червоний вогнегасник, стіна вогню та мешканець"
    "02-burning-doorway-duo": "Двоє переляканих мешканців на тлі палаючих дверей у багатоповерхівці"
    "03-night-street-rescue": "Нічна вулиця біля чотириповерхового будинку, що горить, із рятувальним фургоном і мешканцями"
    "04-resident-panic": "Вусатий мешканець у комбінезоні та паперовому капелюсі перед охопленими вогнем дверима"
  event_label: "Конкурс"
  event_value: "Flame and Blame Dev Contest (RetroStyle Games), 2026"
  build_time: "9 днів"
  desktop_hint: "Лише для комп'ютера: потрібні клавіатура й миша. Перше завантаження — близько 19 МБ."
  about: "Гра від першої особи про гасіння пожежі й порятунок людей у чотириповерховому будинку, що горить. Вогонь, дим, двері й десять наляканих мешканців живуть в одній симуляції: через відчинені двері полум'я перекидається в сусідню кімнату, зачинені — його стримують. У вас три хвилини, вогнегасник, сокира й дефібрилятор, щоб доставити щонайменше шістьох до рятувального фургона, поки будинок не обвалився."
  controls: "WASD — рух, миша — огляд, Space / Shift / Ctrl (або C) — стрибок / біг / присід. E — відчинити чи зачинити двері, схопити чи відпустити мешканця або річ. Ліва кнопка миші — гасити, бити сокирою, використати дефібрилятор, утримати для кидка. 1 / 2 / 3 — вибір інструмента, коліщатко — відстань захвату. F — ліхтарик, M — вимкнути голоси, R — рестарт, Esc — пауза."
  story_title: "Навіщо цей прототип"
  story: "Ember Panic — моя робота на Flame and Blame Dev Contest від RetroStyle Games. Завдання: взяти одну механіку й зробити її системою, а не окремим ефектом, у Unity та з допомогою AI. Я обрав поширення вогню через двері: мешканці, дим, вогнегасник і таймер обвалу читають і змінюють одну й ту саму сітку вогню. AI допоміг із 3D-моделями, процедурним звуком, кодом і перевірками в редакторі; дизайн, баланс, освітлення й плейтести — мої."
  faq:
    - q: "Чи можна грати в Ember Panic на телефоні?"
      a: "Ні. Це гра від першої особи, їй потрібні клавіатура й миша, тож запускайте її в браузері на комп'ютері (Chrome, Edge або Firefox)."
    - q: "Як виграти?"
      a: "Виведіть мешканців із будинку й доставте їх до рятувального фургона, поки не скінчилися 3 хвилини або будинок не обвалився. Якщо повністю загасити вогонь, мета зміниться на порятунок усіх, хто лишився."
    - q: "Чому двері такі важливі?"
      a: "Через відчинені двері вогонь іде з кімнати в кімнату в рази швидше, ніж крізь стіни. Зачинені за собою двері дають вам час, а виламані сокирою — пропускають полум'я."
    - q: "Чи можна навчитися робити таку гру на заняттях з Unity?"
      a: "Так. На індивідуальних заняттях з Unity та C# учні створюють 2D/3D-прототипи, зокрема прості симуляції на кшталт цієї сітки вогню, і публікують їх у WebGL, щоб ділитися посиланням."

ru:
  title: "Ember Panic"
  tagline: "Туши огонь. Вытаскивай соседей. Закрывай двери за собой."
  kicker: "Конкурсный прототип на Unity 6 WebGL"
  badge: "Flame and Blame Dev Contest"
  cover_alt: "Ember Panic — огненный логотип поверх горящего коридора квартиры, испуганного жильца и красного огнетушителя"
  screenshot_alts:
    "01-extinguisher-hallway": "Вид от первого лица в горящем коридоре: красный огнетушитель, стена пламени и жилец"
    "02-burning-doorway-duo": "Двое перепуганных жильцов на фоне горящей двери в жилом доме"
    "03-night-street-rescue": "Ночная улица у горящего четырёхэтажного дома со спасательным фургоном и жильцами"
    "04-resident-panic": "Усатый жилец в комбинезоне и бумажной шапочке перед охваченной огнём дверью"
  event_label: "Конкурс"
  event_value: "Flame and Blame Dev Contest (RetroStyle Games), 2026"
  build_time: "9 дней"
  desktop_hint: "Только для компьютера: нужны клавиатура и мышь. Первая загрузка — около 19 МБ."
  about: "Игра от первого лица о тушении пожара и спасении людей в горящем четырёхэтажном доме. Огонь, дым, двери и десять перепуганных жильцов живут в одной симуляции: через открытую дверь пламя перекидывается в соседнюю комнату, закрытая — сдерживает его. У вас три минуты, огнетушитель, топор и дефибриллятор, чтобы доставить хотя бы шестерых к спасательному фургону, пока дом не обрушился."
  controls: "WASD — движение, мышь — обзор, Space / Shift / Ctrl (или C) — прыжок / бег / присед. E — открыть или закрыть дверь, схватить или отпустить жильца или предмет. Левая кнопка мыши — тушить, бить топором, использовать дефибриллятор, удерживать для броска. 1 / 2 / 3 — выбор инструмента, колёсико — дистанция захвата. F — фонарик, M — выключить голоса, R — рестарт, Esc — пауза."
  story_title: "Зачем этот прототип"
  story: "Ember Panic — моя работа на Flame and Blame Dev Contest от RetroStyle Games. Задача: взять одну механику и сделать её системой, а не отдельным эффектом, в Unity и с помощью AI. Я выбрал распространение огня через двери: жильцы, дым, огнетушитель и таймер обрушения читают и меняют одну и ту же сетку огня. AI помог с 3D-моделями, процедурным звуком, кодом и проверками в редакторе; дизайн, баланс, освещение и плейтесты — мои."
  faq:
    - q: "Можно ли играть в Ember Panic на телефоне?"
      a: "Нет. Это игра от первого лица, ей нужны клавиатура и мышь, поэтому запускайте её в браузере на компьютере (Chrome, Edge или Firefox)."
    - q: "Как победить?"
      a: "Выведите жильцов из дома и доставьте их к спасательному фургону, пока не закончились 3 минуты или дом не обрушился. Если полностью потушить огонь, цель сменится на спасение всех, кто остался."
    - q: "Почему двери так важны?"
      a: "Через открытые двери огонь идёт из комнаты в комнату в разы быстрее, чем сквозь стены. Закрытая за собой дверь даёт время, а выломанная топором — пропускает пламя."
    - q: "Можно ли научиться делать такую игру на уроках по Unity?"
      a: "Да. На индивидуальных уроках по Unity и C# ученики создают 2D/3D-прототипы, в том числе простые симуляции вроде этой сетки огня, и публикуют их в WebGL."

ko:
  title: "Ember Panic"
  tagline: "불을 끄고, 이웃을 구하고, 지나간 문은 닫으세요."
  kicker: "Unity 6 WebGL 공모전 프로토타입"
  badge: "Flame and Blame Dev Contest"
  cover_alt: "Ember Panic — 불타는 아파트 복도와 겁에 질린 주민, 빨간 소화기 위의 불꽃 타이틀"
  screenshot_alts:
    "01-extinguisher-hallway": "불타는 아파트 복도에서의 1인칭 시점: 빨간 소화기, 불길, 그리고 주민"
    "02-burning-doorway-duo": "불타는 문 앞에 서 있는 겁에 질린 두 명의 주민"
    "03-night-street-rescue": "불타는 4층 아파트 건물 밖 밤거리와 구조 차량, 대피하는 주민들"
    "04-resident-panic": "불타는 문 앞에서 놀란 표정으로 서 있는 작업복 차림의 콧수염 주민"
  event_label: "공모전"
  event_value: "Flame and Blame Dev Contest (RetroStyle Games), 2026"
  build_time: "9일"
  desktop_hint: "PC 전용: 키보드와 마우스가 필요합니다. 첫 로딩은 약 19MB입니다."
  about: "불타는 4층 아파트에서 화재를 진압하고 사람을 구하는 1인칭 게임입니다. 불, 연기, 문, 겁에 질린 주민 10명이 하나의 시뮬레이션을 공유합니다. 열린 문으로는 불이 옆방으로 번지고, 닫힌 문은 불길을 막아 줍니다. 건물이 무너지기 전 3분 안에 소화기, 도끼, 제세동기로 최소 6명을 구조 차량에 태우세요."
  controls: "WASD — 이동, 마우스 — 시점, Space / Shift / Ctrl(또는 C) — 점프 / 달리기 / 앉기. E — 문 열기·닫기, 주민이나 물건 잡기·놓기. 마우스 왼쪽 — 분사, 도끼 휘두르기, 제세동기 사용, 길게 눌러 던지기. 1 / 2 / 3 — 도구 전환, 휠 — 잡는 거리. F — 손전등, M — 음성 끄기, R — 재시작, Esc — 일시정지."
  story_title: "이 프로토타입을 만든 이유"
  story: "Ember Panic은 RetroStyle Games의 Flame and Blame Dev Contest 출품작입니다. 과제는 하나의 메커니즘을 단순한 효과가 아닌 시스템으로 Unity와 AI 보조 개발로 구현하는 것이었습니다. 저는 문을 통한 화재 확산을 골랐습니다. 주민, 연기, 소화기, 붕괴 타이머가 모두 같은 화재 그리드를 읽고 바꿉니다. AI는 3D 모델, 절차적 사운드, 코드, 에디터 검사를 도왔고, 디자인·밸런스·조명·플레이테스트는 직접 했습니다."
  faq:
    - q: "휴대폰에서 플레이할 수 있나요?"
      a: "아니요. 키보드와 마우스가 필요한 1인칭 게임이므로 PC 브라우저(Chrome, Edge, Firefox)에서 실행하세요."
    - q: "어떻게 이기나요?"
      a: "3분이 지나거나 건물이 무너지기 전에 주민들을 밖으로 데리고 나와 구조 차량에 태우세요. 불을 완전히 끄면 목표가 남은 모든 사람 구조로 바뀝니다."
    - q: "왜 문이 그렇게 중요한가요?"
      a: "열린 문으로는 불이 벽을 통할 때보다 훨씬 빠르게 방에서 방으로 번집니다. 지나간 문을 닫으면 시간을 벌고, 도끼로 부순 문은 불길을 통과시킵니다."
    - q: "Unity 수업에서 이런 게임을 만들어 볼 수 있나요?"
      a: "네. 1:1 Unity & C# 수업에서 이런 화재 그리드 같은 간단한 시뮬레이션을 포함한 2D/3D 프로토타입을 만들고 WebGL로 배포합니다."

pl:
  title: "Ember Panic"
  tagline: "Gaś ogień. Wyciągaj sąsiadów. Zamykaj za sobą drzwi."
  kicker: "Konkursowy prototyp Unity 6 WebGL"
  badge: "Flame and Blame Dev Contest"
  cover_alt: "Ember Panic — ognisty tytuł nad płonącym korytarzem mieszkania, przerażonym lokatorem i czerwoną gaśnicą"
  screenshot_alts:
    "01-extinguisher-hallway": "Widok z pierwszej osoby w płonącym korytarzu z czerwoną gaśnicą i lokatorem w płomieniach"
    "02-burning-doorway-duo": "Dwóch przerażonych lokatorów stojących przed płonącymi drzwiami w bloku"
    "03-night-street-rescue": "Nocna ulica przed płonącym 4-piętrowym blokiem z furgonetką ratunkową i uciekającymi mieszkańcami"
    "04-resident-panic": "Wąsaty lokator w kombinezonie i papierowej czapce przed płonącymi drzwiami"
  event_label: "Konkurs"
  event_value: "Flame and Blame Dev Contest (RetroStyle Games), 2026"
  build_time: "9 dni"
  desktop_hint: "Tylko na komputer: potrzebujesz klawiatury i myszy. Pierwsze ładowanie to około 19 MB."
  about: "Pierwszoosobowa gra o gaszeniu pożaru i ratowaniu mieszkańców w płonącym 4-piętrowym bloku. Ogień, dym, drzwi i dziesięciu spanikowanych lokatorów współdzielą jedną symulację: otwarte drzwi wpuszczają ogień do kolejnego pokoju, zamknięte go powstrzymują. Masz trzy minuty, gaśnicę, siekierę i defibrylator, aby doprowadzić co najmniej sześć osób do furgonetki ratunkowej, zanim budynek się zawali."
  controls: "WASD — ruch, mysz — rozglądanie, Space / Shift / Ctrl (lub C) — skok / sprint / kucanie. E — otwieranie i zamykanie drzwi, podnoszenie lub upuszczanie lokatora albo przedmiotu. Lewy przycisk myszy — gaszenie, cios siekierą, użycie defibrylatora, przytrzymanie do rzutu. 1 / 2 / 3 — zmiana narzędzia, kółko myszy — dystans chwytu. F — latarka, M — wyciszenie głosów, R — restart, Esc — pauza."
  story_title: "Po co powstał ten prototyp"
  story: "Ember Panic to moje zgłoszenie na Flame and Blame Dev Contest organizowany przez RetroStyle Games. Zadaniem było wzięcie jednej mechaniki i zbudowanie z niej systemu, a nie pojedynczego efektu, w Unity i z pomocą AI. Wybrałem rozprzestrzenianie się ognia przez drzwi: lokatorzy, dym, gaśnica i licznik zawalenia czytają i zmieniają tę samą siatkę ognia. AI pomogło w modelach 3D, proceduralnym dźwięku, kodzie i testach w edytorze; projekt, balans, oświetlenie i playtesty są moje."
  faq:
    - q: "Czy mogę zagrać w Ember Panic na telefonie?"
      a: "Nie. To gra pierwszoosobowa wymagająca klawiatury i myszy, więc uruchom ją w przeglądarce na komputerze (Chrome, Edge lub Firefox)."
    - q: "Jak wygrać?"
      a: "Wyprowadź mieszkańców z budynku do furgonetki ratunkowej, zanim miną 3 minuty lub budynek się zawali. Całkowite ugaszenie ognia zmienia cel na uratowanie wszystkich pozostałych."
    - q: "Dlaczego drzwi są tak ważne?"
      a: "Ogień rozprzestrzenia się przez otwarte drzwi wielokrotnie szybciej niż przez ściany. Zamknięcie drzwi za sobą daje cenny czas, a wyważenie ich siekierą otwiera drogę płomieniom."
    - q: "Czy uczniowie mogą stworzyć podobną grę na lekcjach Unity?"
      a: "Tak. Na indywidualnych lekcjach Unity i C# budujemy grywalne prototypy 2D/3D, w tym proste symulacje takie jak ta siatka ognia, i publikujemy je w WebGL."
