en:
  title: "Dish of Chaos"
  tagline: "Rotate the tray. Match the dishes. Let your mistakes fight back."
  kicker: "Original Unity 6 WebGL Game"
  badge: "Ihrovary Jam 2026"
  cover_alt: "Dish of Chaos — pixel art cover with ingredients on a wooden tray"
  event_label: "Game Jam"
  event_value: "Ihrovary Jam 2026"
  about: "A fast radial arcade game built for Ihrovary Jam 2026. Missed ingredients become orbiting trash that can either ruin your dish or save your run with ricochets."
  controls: "Mouse / Touch / Left-Right Arrow Keys (A/D) to rotate the tray and catch ingredients."
  itch_btn: "itch.io Page"
  faq:
    - q: "Can I play Dish of Chaos without installing anything?"
      a: "Yes. Click the play button above to load the self-hosted Unity 6 WebGL build directly in your browser."
    - q: "Why does Dish of Chaos use a square 1:1 viewport?"
      a: "The game was designed around a circular radial arena and also targets square/round Wear OS smartwatches, so a 1:1 frame keeps the action centered without wasted margins."
    - q: "Can students build similar WebGL games in your Unity lessons?"
      a: "Yes. In 1-on-1 Unity & C# lessons we build playable 2D/3D prototypes and export them to WebGL so students can share a live link."

uk:
  title: "Dish of Chaos"
  tagline: "Обертай тарілку. Збирай страви. Не дай хаосу перемогти."
  kicker: "Авторська Unity 6 WebGL гра"
  badge: "Ігровари джем 2026"
  cover_alt: "Обкладинка гри Dish of Chaos з інгредієнтами на дерев'яній таці"
  event_label: "Геймджем"
  event_value: "Ігровари джем 2026"
  about: "Швидка радіальна аркада, створена для «Ігровари джем 2026». Пропущені інгредієнти стають орбітальним сміттям, що може як зіпсувати страву, так і врятувати вас завдяки рикошетам."
  controls: "Миша / Сенсорний екран / Стрілки вліво-вправо (A/D) для обертання тарілки та лову страв."
  itch_btn: "Сторінка на itch.io"
  faq:
    - q: "Чи можна грати в Dish of Chaos без встановлення?"
      a: "Так. Натисніть кнопку запуску вище — локальний WebGL-білд на Unity 6 завантажиться прямо у браузері."
    - q: "Чому у Dish of Chaos квадратне вікно 1:1?"
      a: "Гра побудована навколо круглої арени й адаптована під екрани смартгодинників Wear OS, тому формат 1:1 тримає фокус у центрі без зайвих порожніх полів."
    - q: "Чи можна навчитися робити схожі WebGL-ігри на заняттях з Unity?"
      a: "Так. На індивідуальних заняттях з Unity та C# учні створюють власні 2D/3D-прототипи й публікують їх у WebGL, щоб ділитися посиланням."

ru:
  title: "Dish of Chaos"
  tagline: "Вращай поднос. Собирай блюда. Не дай хаосу победить."
  kicker: "Авторская Unity 6 WebGL игра"
  badge: "Ігровари джем 2026"
  cover_alt: "Обложка игры Dish of Chaos с ингредиентами на деревянном подносе"
  event_label: "Геймджем"
  event_value: "Ігровари джем 2026"
  about: "Быстрая радиальная аркада, созданная для «Ігровари джем 2026». Пропущенные ингредиенты становятся орбитальным мусором, способным как испортить блюдо, так и спасти вас рикошетом."
  controls: "Мышь / Сенсорный экран / Стрелки влево-вправо (A/D) для вращения подноса и ловли блюд."
  itch_btn: "Страница на itch.io"
  faq:
    - q: "Можно ли играть в Dish of Chaos без установки?"
      a: "Да. Нажмите кнопку запуска выше — локальный WebGL-билд на Unity 6 загрузится прямо в браузере."
    - q: "Почему у Dish of Chaos квадратное окно 1:1?"
      a: "Игра построена вокруг круглой арены и ориентирована в том числе на экраны смарт-часов Wear OS, поэтому формат 1:1 держит действие в центре без лишних пустых полей."
    - q: "Можно ли научиться делать похожие WebGL-игры на занятиях по Unity?"
      a: "Да. На индивидуальных уроках по Unity и C# ученики создают собственные 2D/3D-прототипы и собирают их в WebGL."

ko:
  title: "Dish of Chaos"
  tagline: "쟁반을 돌려 요리를 맞추세요. 실수가 반격하게 두세요."
  kicker: "Unity 6 WebGL 오리지널 게임"
  badge: "Ihrovary Jam 2026"
  cover_alt: "나무 쟁반 위의 재료가 보이는 Dish of Chaos 게임 커버"
  event_label: "게임 잼"
  event_value: "Ihrovary Jam 2026"
  about: "«Ihrovary Jam 2026»을 위해 제작된 빠른 속도의 방사형 아케이드 게임입니다. 놓친 재료는 궤도를 도는 쓰레기가 되어 요리를 망치거나 도탄으로 게임을 살릴 수 있습니다."
  controls: "마우스 / 터치 / 좌우 화살표 키 (A/D)로 쟁반을 회전하여 재료를 받으세요."
  itch_btn: "itch.io 페이지"
  faq:
    - q: "설치 없이 브라우저에서 바로 플레이할 수 있나요?"
      a: "네. 위의 재생 버튼을 누르면 자체 호스팅된 Unity 6 WebGL 빌드가 브라우저에서 바로 실행됩니다."
    - q: "왜 Dish of Chaos는 1:1 정사각형 화면을 사용하나요?"
      a: "원형 아레나와 Wear OS 스마트워치 화면에 맞춰 설계되어 1:1 비율이 여백 없이 가장 깔끔하게 동작합니다."
    - q: "Unity 수업에서 이런 WebGL 게임을 직접 만들어 볼 수 있나요?"
      a: "네. 1:1 Unity & C# 수업에서 직접 2D/3D 프로토타입을 만들고 WebGL로 빌드하는 과정을 다룹니다."
