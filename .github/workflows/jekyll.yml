name: Deploy Jekyll with Polyglot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions to deploy Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # jekyll-last-modified-at derives published timestamps from Git.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify build runtime
        run: |
          ruby --version
          bundle --version
          bundle exec jekyll --version

      - name: Cache Jekyll
        uses: actions/cache@v6
        with:
          path: .jekyll-cache
          key: ${{ runner.os }}-jekyll-${{ hashFiles('Gemfile.lock') }}-${{ hashFiles('_config.yml') }}
          restore-keys: |
            ${{ runner.os }}-jekyll-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Validate tutoring content rules
        run: bundle exec ruby scripts/test_tutoring_content.rb

      - name: Check Jekyll diagnostics
        run: bundle exec jekyll doctor

      - name: Validate multilingual pagination
        run: bundle exec ruby scripts/test_polyglot_pagination.rb

      - name: Validate tutoring build guards
        run: bundle exec ruby scripts/test_tutoring_build.rb

      - name: Validate service worker routing
        run: node scripts/test_service_worker.cjs

      - name: Audit author readiness status
        run: bundle exec ruby scripts/verify_author_ready.rb

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Verify Git-derived content timestamps
        run: bundle exec ruby scripts/test_last_modified_history.rb

      - name: Validate production metadata and budgets
        run: bundle exec ruby scripts/test_site.rb

      - name: Validate all local links and preserve published routes
        run: bundle exec ruby scripts/audit_links.rb

      - name: Test with HTML Proofer
        run: |
          bundle exec htmlproofer ./_site \
            --allow-hash-href \
            --ignore-empty-alt \
            --ignore-urls "/^https:\/\/(sivochka\.com|figarist\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|mermaid\.ink|polyfill\.io)/"

      - name: Check JS bundle size
        run: |
          JS_SIZE=$(wc -c < _site/script.js)
          echo "JS size: $JS_SIZE bytes"
          if [ $JS_SIZE -gt 20480 ]; then
            echo "::error::JS exceeds 20KB budget ($JS_SIZE bytes)"
            exit 1
          fi

      - name: Check gzipped CSS bundle size
        run: |
          CSS_SIZE=$(gzip -c _site/assets/css/styles.css | wc -c)
          echo "Gzipped CSS size: $CSS_SIZE bytes"
          if [ $CSS_SIZE -gt 30720 ]; then
            echo "::error::Gzipped CSS exceeds 30KB budget ($CSS_SIZE bytes)"
            exit 1
          fi

      - name: Check tutoring drafts stay out of public output
        run: |
          test ! -e _site/docs/tutoring-content-guide.md
          if rg -n "case-template|synthetic-build-bad|student_cases" _site; then
            echo "::error::Draft or synthetic tutoring content leaked into _site"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verify live domain
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify sitemap URLs and domain redirects
        run: ruby scripts/verify_live_site.rb
