  <section class="tutoring-section tutoring-section--video" aria-labelledby="video-title">
    <h2 id="video-title">{{ t.video_title }}</h2>
    <p>{{ t.video_text }}</p>
    {%- comment -%} Click-to-load: nothing is requested from YouTube/Google until the visitor presses play (script.js swaps in the iframe). {%- endcomment -%}
    <button type="button" class="tutoring-video tutoring-video--facade" data-yt-src="https://www.youtube-nocookie.com/embed/3CxXkJ8ANbQ" data-yt-title="{{ t.video_title | escape }}" aria-label="{{ t.video_title | escape }}">
      <span class="tutoring-video__play" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
      <span class="tutoring-video__note">{{ site.data[site.active_lang].strings.video_load_note }}</span>
    </button>
    <a class="text-link" href="https://youtu.be/3CxXkJ8ANbQ" target="_blank" rel="noopener" data-goatcounter-click="tutoring-intro-video">{{ t.video_cta }} <span aria-hidden="true">↗</span></a>
  </section>
