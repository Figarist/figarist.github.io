name: Notify Telegram

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      status:
        required: false
        type: string
        default: "error"
      details:
        required: false
        type: string
        default: ""
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
  workflow_dispatch:
    inputs:
      title:
        required: true
        type: string
        default: "Test notification from GitHub Actions"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TITLE: ${{ inputs.title }}
          ALERT_STATUS: ${{ inputs.status || 'info' }}
          ALERT_DETAILS: ${{ inputs.details }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not configured; skipping alert."
            exit 0
          fi

          python3 - <<'PY'
          import json, os, urllib.request

          icons = {"ok": "✅", "info": "🔔", "warn": "⚠️", "error": "❌"}
          icon = icons.get(os.environ.get("ALERT_STATUS", "info"), "🔔")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          title = os.environ.get("ALERT_TITLE", "")
          details = os.environ.get("ALERT_DETAILS", "")
          run_url = os.environ.get("RUN_URL", "")

          lines = [f"{icon} [{repo}] {title}"]
          if details:
              lines.append(details)
          lines.append(f"Run: {run_url}")

          payload = json.dumps({
              "chat_id": os.environ["TG_CHAT_ID"],
              "text": "\n".join(lines),
              "disable_web_page_preview": True,
          }).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              print("Telegram status:", resp.status)
          PY
