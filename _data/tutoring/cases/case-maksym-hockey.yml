    title: "Hockey Zombie — власна мережева 3D-гра на льоду"
    card_description: "Справжня онлайн-гра на двох: ковзання по льоду, ключка, зомбі замість шайби та можливість грати з другом по мережі."
    full_description: "Максим хотів створити не просто навчальний проєкт, а динамічну екшн-гру, у яку можна грати разом із друзями через інтернет. Разом ми реалізували повноцінний хокейний бій: гравець керує хокеїстом, відчуває інерцію ковзання, відбиває хвилі зомбі та забиває їх ключкою у ворота суперника."
    starting_level: "Учень вже знав основи комп'ютера й трохи програмував, але хотів створити складну 3D-гру з мультиплеєром."
    goal: "Створити авторську гру з нуля та зіграти в неї по мережі з друзями."
    created: "Грабельний 3D-екшн для двох гравців: вибір форми, ковзання по льоду, суперники-зомбі, боти-помічники та підрахунок очок."
    student_work: "Створив арену й зовнішній вигляд гравців, налаштував анімації рухів і ударів ключкою, зібрав головне меню, магазин форми та логіку швидкого ривка (Dash)."
    tutor_help: "Допоміг налаштувати з'єднання між гравцями через інтернет, оптимізувати плавність рухів і створити тестовий режим для перевірки всіх механік."
    skills:
      - "Створення 3D-ігор у рушії Unity"
      - "Мережеве програмування (мультиплеєр для гри по інтернету)"
      - "Фізика руху персонажа та ковзання на льоду"
      - "Налаштування плавної анімації персонажів"
      - "Розробка зручного меню та інтерфейсу гри"
      - "Самостійне тестування та пошук помилок у коді"
    evidence: "Робоча гра, у яку учень грає разом із викладачем та друзями через інтернет."
