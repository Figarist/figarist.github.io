  - id: buki-yevgen-uk
    mode: exact_text
    status: draft
    ready: false
    permission: false
    language: uk
    signature: "Євген (навчається разом із двома дітьми)"
    source_url: "https://buki.com.ua/user-82505/"
    date: "2026-07-28"
    direction: "Unity та C#"
    text: >-
      Ігор відкрив для мене цілий світ розробки ігор у Unity. Навчатися з ним було не лише корисно, а й дуже приємно: він чудовий співрозмовник, усе пояснює зрозуміло, цікаво й доступно. Зараз у Ігоря навчаються ще й двоє моїх дітей, вони також із задоволенням відвідують заняття та дуже ними захоплені. Окрім Unity, діти розвивають загальну комп’ютерну грамотність, що особливо цінно. Це неймовірний досвід як для дітей, так і для дорослих. Щиро й наполегливо рекомендую Ігоря всім, хто хоче опанувати Unity та впевненіше почуватися у світі сучасних технологій. Максимальна оцінка!

