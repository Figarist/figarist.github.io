# %EMAIL% and %TELEGRAM% are replaced in privacy/index.html with site.email and the tutoring Telegram URL.
nav: "Политика конфиденциальности"
title: "Политика конфиденциальности"
updated: "Последнее обновление: 27 ноября 2026"
intro: >-
  Здесь объяснено, что происходит с вашими данными, когда вы открываете sivochka.com, пользуетесь бесплатными
  инструментами и играми или пишете мне о занятиях. Коротко: без cookies, без рекламы, без продажи или передачи данных
  для маркетинга и без слежки на других сайтах.
sections:
  - h: "Кто отвечает за данные"
    body:
      - >-
        Владелец персональных данных — Игорь Сивочка, физическое лицо-предприниматель (ФЛП), зарегистрированный в
        Украине. По любому вопросу о конфиденциальности пишите на <a href="mailto:%EMAIL%">%EMAIL%</a> или в
        <a href="%TELEGRAM%">Telegram</a>.
  - h: "Хостинг и безопасность"
    body:
      - >-
        Сайт размещён на GitHub Pages (GitHub, Inc., США) и доставляется через Cloudflare (Cloudflare, Inc., США), который
        ускоряет его и защищает от атак и вредных ботов. Чтобы показать страницу, эти провайдеры обрабатывают технические
        данные запроса: IP-адрес, тип браузера (User-Agent), адрес страницы, страницу, с которой вы пришли, и время. Это
        нужно, чтобы сайт работал и был в безопасности (законный интерес, ст. 6(1)(f) GDPR). Провайдеры хранят такие
        журналы недолго по своим правилам; ваш IP-адрес я от них не получаю.
  - h: "Статистика посещений"
    body:
      - >-
        Чтобы понимать, какие страницы и инструменты полезны, я считаю посещения двумя сервисами без cookies:
      - list:
          - >-
            <b>GoatCounter</b> (открытый код, серверы в ЕС), работающий через мой собственный прокси на Cloudflare. При
            каждом просмотре он получает IP-адрес, User-Agent и страницу, с которой вы пришли, чтобы считать уникальные
            визиты, и не хранит IP. Также он считает нажатия некоторых кнопок (например «Написать в Telegram» или запуск
            игры), не зная, кто именно нажал.
          - >-
            <b>Cloudflare Web Analytics</b> — скрипт хостинг-провайдера, который считает визиты и скорость загрузки
            страниц. Он не использует cookies и отпечатки браузера и не создаёт профилей посетителей.
      - >-
        Я вижу только общие цифры: сколько визитов, с каких сайтов, на какие страницы, из какой страны. Ни один сервис не
        идентифицирует вас, и я не объединяю эти данные ни с какими другими. Правовое основание — законный интерес делать
        сайт полезным (ст. 6(1)(f) GDPR). Оба можно заблокировать любым блокировщиком, сайт продолжит работать.
  - h: "Что хранится в вашем браузере"
    body:
      - >-
        Сайт не устанавливает cookies. Несколько вещей сохраняются только в вашем браузере и никогда не отправляются мне:
      - list:
          - "выбранный язык, чтобы в следующий раз сайт открылся на нём;"
          - "кеш файлов сайта (service worker), чтобы страницы открывались быстрее и работали офлайн;"
          - "настройки и прогресс в бесплатных инструментах, например избранное в каталоге LEGO;"
          - "сохранения игр и кеш игровых файлов, когда вы запускаете игру с play.sivochka.com."
      - >-
        Всё это можно в любой момент удалить в настройках браузера (данные сайта sivochka.com).
  - h: "Инструменты работают на вашем устройстве"
    body:
      - >-
        Бесплатные инструменты (OGCruncher, pyScratch, Can I Run Unity, Bouncy, каталог инструкций LEGO и другие)
        обрабатывают ваши файлы и настройки прямо в браузере. Аудиофайлы, проекты Scratch и другие файлы, которые вы
        открываете, никуда не загружаются. Bouncy включает микрофон только после вашего разрешения, измеряет громкость на
        устройстве и не записывает и не отправляет звук.
  - h: "Видео и внешние ссылки"
    body:
      - >-
        Вступительное видео на страницах репетиторства загружается с YouTube (Google) только после нажатия
        «Воспроизвести»; до этого запросов к YouTube нет. После запуска действует
        <a href="https://policies.google.com/privacy?hl=ru" rel="noopener">политика конфиденциальности Google</a>.
        Ссылки на Telegram, GitHub, Google Drive (инструкции LEGO), Wrist &amp; Pocket Studio и другие сайты открывают эти
        сервисы, и там действуют их собственные правила.
  - h: "Когда вы пишете мне о занятиях"
    body:
      - >-
        На сайте нет форм. Если вы пишете мне в Telegram или на почту, я получаю то, что вы отправляете (имя, контакт,
        возраст ученика, уровень и цели), и использую это только для ответа, договорённости и проведения занятий
        (действия до заключения и для исполнения договора, ст. 6(1)(b) GDPR). Переписку храню, пока мы работаем вместе, и
        столько, сколько требуют украинские правила учёта платежей, а по вашему запросу удаляю, если закон не требует её
        хранить. Оплата поступает на счёт украинского ФЛП; сам сайт платежи не обрабатывает.
      - >-
        Для собственной статистики я записываю только дату, канал, откуда пришёл запрос (например Google или Telegram), и
        этап (написал, пробное занятие, ученик). Имён и контактов там нет.
  - h: "Дети"
    body:
      - >-
        Занятия для несовершеннолетних согласуются с родителями или опекунами. Сайт не запрашивает у детей персональные
        данные. Проекты учеников публикуются только с письменного согласия родителей и показывают лишь имя, первую букву
        фамилии и возраст, без фото и города.
  - h: "Передача данных за границу"
    body:
      - >-
        Cloudflare, GitHub и Google находятся в США. Передача данных им основана на рамочном соглашении EU–US Data Privacy
        Framework и стандартных договорных положениях Европейской комиссии, которые используют эти компании.
  - h: "Ваши права"
    body:
      - >-
        Согласно GDPR (ЕС/ЕЭЗ), UK GDPR и Закону Украины «О защите персональных данных» вы можете узнать, какие данные о
        вас у меня есть, исправить или удалить их, ограничить обработку или возразить против неё и получить данные в
        удобном формате. Пишите на <a href="mailto:%EMAIL%">%EMAIL%</a>; отвечаю в течение 30 дней. Также вы можете подать
        жалобу в орган защиты данных своей страны (в Украине — Уполномоченному Верховной Рады Украины по правам
        человека).
  - h: "Изменения"
    body:
      - >-
        Если я добавлю новые сервисы или изменю способ использования данных, то обновлю эту страницу до того, как
        изменение вступит в силу, и изменю дату вверху.
