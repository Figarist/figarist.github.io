  <section class="tutoring-section tutoring-section--video" aria-labelledby="video-title">
    <h2 id="video-title">{{ t.video_title }}</h2>
    <p>{{ t.video_text }}</p>
    <iframe class="tutoring-video" src="https://www.youtube-nocookie.com/embed/3CxXkJ8ANbQ" title="{{ t.video_title | escape }}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <a class="text-link" href="https://youtu.be/3CxXkJ8ANbQ" target="_blank" rel="noopener" data-goatcounter-click="tutoring-intro-video">{{ t.video_cta }} <span aria-hidden="true">↗</span></a>
  </section>
